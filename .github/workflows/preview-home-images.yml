name: Preview homepage image optimization
on:
  push:
    branches: [preview/home-performance-20261126]
    paths:
      - scripts/optimize-home-images.py
      - .github/workflows/preview-home-images.yml
permissions:
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-home-images.py
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-home-images
          path: |
            art/*-home-*.webp
            assets/*-home-*.webp
