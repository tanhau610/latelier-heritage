name: Preview homepage image optimization
on:
  push:
    branches: [preview/home-performance-20261126]
    paths:
      - scripts/optimize-home-images.py
      - .github/workflows/preview-home-images.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-home-images.py
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-home-images
          path: |
            art/*-home-*.webp
            assets/*-home-*.webp

      - name: Commit generated preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/*-home-*.webp assets/*-home-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized homepage artwork for preview"
            git push origin HEAD:preview/home-performance-20261126
          fi
