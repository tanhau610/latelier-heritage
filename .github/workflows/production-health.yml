name: Production website health check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health.yml"
      - "scripts/check-production.mjs"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public pages and redirects
        run: node scripts/check-production.mjs
