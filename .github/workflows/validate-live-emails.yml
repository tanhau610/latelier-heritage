name: Validate Live email flows
on:
  pull_request:
    paths:
      - 'functions/**'
      - 'workers/**'
      - 'tests/**'
      - '.github/workflows/validate-live-emails.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check functions/api/checkout.js
          node --check functions/api/studio.js
          node --check functions/_lib/live-tracking-email.js
          node --check workers/live-balance-reminders.js
      - name: Regression tests
        run: node --test tests/live-balance-reminder.test.mjs tests/live-tracking-email.test.mjs
